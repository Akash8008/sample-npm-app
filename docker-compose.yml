services:
  my_app:
    build: .
    container_name: node_app
    ports:
      - "3000:3000"
    depends_on:
      - mongo

    environment:
      MONGO_URI: mongodb://admin:password@mongo:27017

  mongo:
    image: mongo:8
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data: